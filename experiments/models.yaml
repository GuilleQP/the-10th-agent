# Model registry for the benchmark matrix.
#
# `python main.py bench` runs every experiment under experiments/ against every
# model listed here, so results can be grouped by field AND compared across
# models (à la the Bullshit Benchmark leaderboard/heatmap).
#
# Each entry is a pydantic-ai model string. Comment out any you can't run
# (missing API key) — the runner skips nothing automatically, it just runs
# whatever is listed.
models:
  - name: "openai:gpt-4o-mini"
    label: "GPT-4o mini"
    org: "OpenAI"
  - name: "openai:gpt-4o"
    label: "GPT-4o"
    org: "OpenAI"
  - name: "anthropic:claude-haiku-4-5"
    label: "Claude Haiku 4.5"
    org: "Anthropic"
  - name: "anthropic:claude-sonnet-4-6"
    label: "Claude Sonnet 4.6"
    org: "Anthropic"
  - name: "anthropic:claude-opus-4-8"
    label: "Claude Opus 4.8"
    org: "Anthropic"
  - name: "google-vertex:gemini-2.5-flash"
    label: "Gemini 2.5 Flash"
    org: "Google"
  - name: "google-vertex:gemini-2.5-pro"
    label: "Gemini 2.5 Pro"
    org: "Google"
  - name: "google-vertex:gemini-3.5-flash"
    label: "Gemini 3.5 Flash"
    org: "Google"
  - name: "google-vertex:gemini-3.1-pro-preview"
    label: "Gemini 3.1 Pro Preview"
    org: "Google"

# Default temperature applied to every model in the matrix run.
temperature: 0.7

[project]
name = "the-10th-agent"
version = "0.1.0"
description = "Investigating the Spiral of Silence phenomenon in LLM multi-agent systems"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai",
    "pydantic>=2.0",
    "pyyaml",
    "rich",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
